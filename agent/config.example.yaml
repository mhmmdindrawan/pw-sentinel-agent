# Parkways Sentinel Agent — runtime configuration.
# Copy this file to config.yaml next to the binary.
#
# One agent instance now serves MANY kiosks/gates over the LAN (or a VPN
# like Tailscale) — location/gate identity per event comes from
# devices.yaml (see devices.example.yaml), not from this file.

# Vestigial: no longer used to stamp events (see devices.yaml). Kept only
# as an optional instance-level label for future use (e.g. in logs).
identity:
  location: ""
  gate: ""
  pos: ""

server:
  # Must be reachable from every kiosk this agent monitors — typically a
  # LAN-bound address, not 127.0.0.1. Firewall this to the LAN/VPN segment
  # the kiosks live on; do not expose it to the public internet, since
  # Tahap 1's bearer tokens are static, non-rotating shared secrets.
  listen_addr: "0.0.0.0:8787"
  registry_path: "registry.yaml"
  devices_path: "devices.yaml"
  db_path: "./data/sentinel.db"

app:
  version: ""   # optional: default app_version stamped on events that omit one
