<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Parkways Sentinel — preview</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style id="theme-css"></style>
<script>
// Preview harness only: stubs the agent API with demo data and lets you
// force light/dark (?theme=light|dark). Not shipped — the leading "_" keeps
// it out of //go:embed static. Serve this directory over HTTP to use it:
//   python3 -m http.server -d agent/internal/web/static 8000
//   → http://127.0.0.1:8000/_preview.html
(function () {
  const now = Date.now(), ago = (s) => new Date(now - s * 1000).toISOString();
  const D = (loc, gate, color, status, seen, e1, e24, outbox, last, x = {}) => ({
    device_id: `${loc}-${gate}-POS01`, location: loc, gate, color, status,
    last_seen: seen == null ? null : ago(seen), app_version: status === "NEVER" ? "" : "3.9.0", sdk_version: status === "NEVER" ? "" : "1.2.0",
    errors_1h: e1, errors_24h: e24, outbox_pending: outbox, last_error: last && { severity: last[0], event: last[1], error_code: last[2], received_at: ago(last[3]) },
    last_heartbeat_at: seen == null ? null : ago(seen), last_event_at: last ? ago(last[3]) : null,
    remote_addr: status === "NEVER" ? "" : "100.64.12." + (20 + gate.slice(1) * 1), pos: "POS01", uptime_s: 3 * 86400 + 4 * 3600, ...x });
  const devices = [
    D("BDG", "G03", "yellow", "ONLINE", 7, 3, 7, 0, ["MEDIUM", "BARRIER_STUCK", "BDG-G03-DEVICE-007", 1320]),
    D("BDG", "G01", "green", "ONLINE", 2, 0, 0, 0, null),
    D("BDG", "G02", "green", "ONLINE", 6, 0, 1, 0, ["LOW", "CCTV_FRAME_DROP", "BDG-G02-CCTV-001", 32400]),
    D("PKW", "G04", "red", "ONLINE", 5, 9, 54, 0, ["CRITICAL", "READER_DISCONNECTED", "PKW-G04-READER-001", 60]),
    D("PKW", "G01", "yellow", "ONLINE", 10, 2, 9, 12, ["MEDIUM", "API_HTTP_5XX", "PKW-G01-API-005", 1080]),
    D("PKW", "G02", "green", "ONLINE", 4, 0, 0, 0, null),
    D("PKW", "G03", "green", "ONLINE", 9, 0, 3, 0, ["LOW", "NET_LATENCY_HIGH", "PKW-G03-NET-002", 10800]),
    D("STI", "G03", "red", "DOWN", 360, 4, 31, 0, ["HIGH", "PAYMENT_TIMEOUT", "STI-G03-PAY-002", 420]),
    D("STI", "G06", "red", "NEVER", null, 0, 0, 0, null),
    D("STI", "G04", "yellow", "STALE", 120, 1, 6, 3, ["MEDIUM", "PRINTER_PAPER_LOW", "STI-G04-PRINTER-003", 2460]),
    D("STI", "G01", "green", "ONLINE", 8, 0, 2, 0, ["LOW", "MQTT_RECONNECT", "STI-G01-MQTT-001", 18000]),
    D("STI", "G02", "green", "ONLINE", 12, 0, 0, 0, null),
    D("STI", "G05", "green", "ONLINE", 3, 0, 1, 0, ["LOW", "LPR_LOW_CONFIDENCE", "STI-G05-LPR-004", 39600]),
  ];
  const E = (id, dev, s, code, event, sev, message, x = {}) => {
    const [location, gate] = dev.split("-");
    return { id, event_id: "evt_" + id.toString(36), device_id: dev, location, gate, occurred_at: ago(s), received_at: ago(s - 1), error_code: code, event, severity: sev, message, app_version: "3.9.0", ...x };
  };
  const events = [
    E(9812, "PKW-G04-POS01", 60, "PKW-G04-READER-001", "READER_DISCONNECTED", "CRITICAL", "serial /dev/ttyUSB0 closed", { device: "READER01", context: { coalesced_count: 4 } }),
    E(9809, "STI-G03-POS01", 420, "STI-G03-PAY-002", "PAYMENT_TIMEOUT", "HIGH", "no response from /cashless/gateoutcashless after 30000 ms", { endpoint: "/cashless/gateoutcashless", duration_ms: 30000, retry_count: 2, transaction_ref: "TRX-20261009-55120" }),
    E(9804, "PKW-G04-POS01", 840, "PKW-G04-READER-002", "READER_NOT_READY", "HIGH", "no answer to status poll", { device: "READER01" }),
    E(9801, "PKW-G01-POS01", 1080, "PKW-G01-API-005", "API_HTTP_5XX", "MEDIUM", "HTTP 502 from payment server", { endpoint: "/cashless/inquiry", http_status: 502, duration_ms: 812, context: { coalesced_count: 2 } }),
    E(9797, "BDG-G03-POS01", 1320, "BDG-G03-DEVICE-007", "BARRIER_STUCK", "MEDIUM", "Boom gate barrier did not respond"),
    E(9790, "STI-G03-POS01", 2040, "STI-G03-PAY-002", "PAYMENT_TIMEOUT", "HIGH", "no response from /cashless/gateoutcashless after 30000 ms", { endpoint: "/cashless/gateoutcashless", duration_ms: 30000 }),
    E(9786, "STI-G04-POS01", 2460, "STI-G04-PRINTER-003", "PRINTER_PAPER_LOW", "MEDIUM", "paper sensor near-end", { device: "PRINTER01" }),
    E(9771, "STI-G03-POS01", 3900, "STI-G03-NET-001", "NET_UNREACHABLE", "HIGH", "gateway 10.20.3.1 unreachable"),
    E(9760, "PKW-G03-POS01", 10800, "PKW-G03-NET-002", "NET_LATENCY_HIGH", "LOW", "rtt 840 ms to agent"),
    E(9748, "STI-G01-POS01", 18000, "STI-G01-MQTT-001", "MQTT_RECONNECT", "LOW", "", { context: { coalesced_count: 3 } }),
    E(9733, "STI-G03-POS01", 23400, "STI-G03-READER-001", "READER_DISCONNECTED", "HIGH", "serial /dev/ttyUSB0 closed", { device: "READER01" }),
    E(9720, "BDG-G02-POS01", 32400, "BDG-G02-CCTV-001", "CCTV_FRAME_DROP", "LOW", "rtsp stream stalled 4 s"),
    E(9702, "STI-G05-POS01", 39600, "STI-G05-LPR-004", "LPR_LOW_CONFIDENCE", "LOW", "plate confidence 0.41"),
  ];
  const SEV = { LOW: 1, MEDIUM: 2, HIGH: 3, CRITICAL: 4 };
  const HOURLY = [0,1,0,0,2,1,0,3,1,0,0,2,4,1,0,1,3,2,6,4,3,5,7,4];
  let authed = true;
  const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
  window.fetch = async (path, opts = {}) => {
    await new Promise((r) => setTimeout(r, 120));
    const u = new URL(path, location.origin), p = u.pathname, q = u.searchParams;
    if (p === "/v1/auth/login") { const b = JSON.parse(opts.body || "{}"); if (b.password && b.password.length >= 4) { authed = true; return json({ username: b.username }); } return json({ error: "bad" }, 401); }
    if (p === "/v1/auth/logout") { authed = false; return json({}); }
    if (!authed) return json({ error: "login required" }, 401);
    if (p === "/v1/auth/me") return json({ username: "noc" });
    if (p === "/v1/fleet") return json({ devices, unmapped_24h: 7 });
    if (p.startsWith("/v1/devices/")) {
      const d = devices.find((x) => x.device_id === decodeURIComponent(p.slice(12)));
      if (!d) return json({ error: "not found" }, 404);
      const scale = d.errors_24h / HOURLY.reduce((a, b) => a + b, 0);
      const hourly_24h = HOURLY.map((v, i) => ({ hour: new Date(now - (23 - i) * 3600e3).toISOString().slice(0, 13), count: Math.round(v * scale) }));
      const m = {};
      events.filter((e) => e.device_id === d.device_id).forEach((e) => { (m[e.error_code] = m[e.error_code] || { error_code: e.error_code, event: e.event, severity: e.severity, count: 0, last_seen: e.received_at }).count++; });
      return json({ device: d, hourly_24h, summary_24h: Object.values(m) });
    }
    if (p === "/v1/events") {
      const since = q.get("since"), before = +q.get("before_id") || Infinity;
      return json(events.filter((e) => e.id < before && (!since || e.received_at >= since)
        && (!q.get("device_id") || e.device_id.includes(q.get("device_id")))
        && (!q.get("location") || e.location === q.get("location"))
        && (!q.get("error_code") || e.error_code.includes(q.get("error_code")))
        && (!q.get("severity") || SEV[e.severity] >= SEV[q.get("severity")])));
    }
    return json({ error: "not found" }, 404);
  };
  const theme = new URLSearchParams(location.search).get("theme");
  const xhr = new XMLHttpRequest();
  xhr.open("GET", "app.css", false); xhr.send();
  let css = xhr.responseText;
  if (theme === "dark") css = css.replace("@media (prefers-color-scheme: dark)", "@media all");
  if (theme === "light") css = css.replace("@media (prefers-color-scheme: dark)", "@media not all");
  document.getElementById("theme-css").textContent = css;
})();
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<a class="skip-link" href="#" id="skip">Lewati ke konten utama</a>
<header class="topbar" id="topbar" hidden>
  <a class="brand" href="#/">Parkways Sentinel</a>
  <nav aria-label="Navigasi utama">
    <a href="#/" data-nav="fleet">Ringkasan</a>
    <a href="#/events" data-nav="events">Event</a>
  </nav>
  <div class="who">
    <span id="who-name"></span>
    <button type="button" class="link" id="logout">Keluar</button>
  </div>
</header>
<div class="conn-banner" id="conn" role="status" hidden></div>
<main id="app"></main>
</body>
</html>
