# Parkways Sentinel — Error Event Registry
#
# Maps a symbolic event name (used by SDKs/callers) to a stable error code.
# Full error code format: <LOCATION>-<GATE>-<CODE>-<NUMBER, zero-padded to 3>
# Example: STI-G03-PAY-002
#
# `category` is the human-readable category label (shown in dashboards/summaries).
# `code` is the short abbreviation used inside the error code string itself.
# `number` must be unique within a `code` group and, once shipped, must never
# be reassigned to a different event — technicians memorize these.
#
# Unknown events sent by a caller (not listed here) are NOT rejected: the
# agent allocates the next free number for the given category on first sight
# and persists the mapping in its local database, so numbering stays stable
# per-agent even for app-specific events that aren't in this seed file yet.

events:
  APP_STARTED:
    category: APP
    code: APP
    number: 1
    severity: INFO
  APP_CRASHED:
    category: APP
    code: APP
    number: 2
    severity: CRITICAL
  APP_EXCEPTION:      # unhandled exception with a stack trace (SDK client.exception())
    category: APP
    code: APP
    number: 3
    severity: HIGH

  PAYMENT_REJECTED:   # customer behaviour, not a fault: never colours a gate
    category: PAY
    code: PAY
    number: 1
    severity: LOW
  PAYMENT_TIMEOUT:
    category: PAY
    code: PAY
    number: 2
    severity: HIGH
  INSUFFICIENT_BALANCE:   # customer behaviour, not a fault
    category: PAY
    code: PAY
    number: 3
    severity: LOW
  QRIS_NOT_CONFIGURED:    # QRIS secret missing in the kiosk config
    category: PAY
    code: PAY
    number: 4
    severity: LOW

  READER_DISCONNECTED:
    category: READER
    code: READER
    number: 1
    severity: HIGH
  CARD_READ_TIMEOUT:
    category: READER
    code: READER
    number: 2
    severity: MEDIUM
  READER_NOT_READY:
    category: READER
    code: READER
    number: 3
    severity: HIGH
  READER_INIT_FAILED:
    category: READER
    code: READER
    number: 4
    severity: MEDIUM
  # reader works again after READER_*; context.down_s
  READER_RECOVERED:
    category: READER
    code: READER
    number: 5
    severity: INFO

  PRINTER_DISCONNECTED:
    category: PRINTER
    code: PRINTER
    number: 1
    severity: MEDIUM
  PRINT_FAILED:
    category: PRINTER
    code: PRINTER
    number: 2
    severity: MEDIUM

  LPR_TIMEOUT:
    category: LPR
    code: LPR
    number: 1
    severity: MEDIUM
  LPR_NO_FEED:        # camera never pushed a frame to the kiosk's LPR port
    category: LPR
    code: LPR
    number: 2
    severity: LOW
  # camera feed back after LPR_*; context.down_s
  LPR_RECOVERED:
    category: LPR
    code: LPR
    number: 3
    severity: INFO

  CCTV_DISCONNECTED:
    category: CCTV
    code: CCTV
    number: 1
    severity: MEDIUM
  # CCTV back after CCTV_DISCONNECTED; context.down_s
  CCTV_RECOVERED:
    category: CCTV
    code: CCTV
    number: 2
    severity: INFO

  MQTT_DISCONNECTED:
    category: MQTT
    code: MQTT
    number: 1
    severity: MEDIUM
  MQTT_CONNECT_FAILED:
    category: MQTT
    code: MQTT
    number: 2
    severity: HIGH
  MQTT_DISABLED:      # MQTT not configured: normal on Windows/Linux, a fault on Tongbao
    category: MQTT
    code: MQTT
    number: 3
    severity: INFO
  # broker connected again after MQTT_DISCONNECTED/MQTT_CONNECT_FAILED; context.down_s
  MQTT_RECOVERED:
    category: MQTT
    code: MQTT
    number: 4
    severity: INFO
  # Broker connected, but the hardware gateway/board behind it has published
  # nothing for longer than the kiosk's threshold (context.silent_s,
  # context.threshold_s). The gate looks connected yet cannot act.
  GATEWAY_SILENT:
    category: MQTT
    code: MQTT
    number: 5
    severity: HIGH

  NETWORK_DISCONNECTED:
    category: NETWORK
    code: NET
    number: 1
    severity: HIGH
  HIGH_LATENCY:
    category: NETWORK
    code: NET
    number: 2
    severity: MEDIUM

  HTTP_SERVER_ERROR:
    category: API
    code: API
    number: 1
    severity: HIGH
  HTTP_TIMEOUT:
    category: API
    code: API
    number: 2
    severity: HIGH
  HTTP_CLIENT_ERROR:
    category: API
    code: API
    number: 3
    severity: MEDIUM
  # payment server reachable again after HTTP_*/NETWORK_*; context.down_s
  SERVER_RECOVERED:
    category: API
    code: API
    number: 4
    severity: INFO

  DATABASE_ERROR:
    category: DATABASE
    code: DB
    number: 1
    severity: HIGH

  DEVICE_ERROR:
    category: DEVICE
    code: DEVICE
    number: 1
    severity: MEDIUM
  GATE_OPEN_FAILED:   # barrier command failed: the gate cannot let cars out
    category: DEVICE
    code: DEVICE
    number: 2
    severity: HIGH
  PCLESS_DISCONNECTED:  # PCLess barrier controller unreachable
    category: DEVICE
    code: DEVICE
    number: 3
    severity: HIGH
  # PCLess/TCP controller reachable again; context.down_s
  PCLESS_RECOVERED:
    category: DEVICE
    code: DEVICE
    number: 4
    severity: INFO

  SYSTEM_ERROR:
    category: SYSTEM
    code: SYS
    number: 1
    severity: MEDIUM
  # kiosk clock differs from the agent's by > 5 min; context.skew_s
  CLOCK_SKEW:
    category: SYSTEM
    code: SYS
    number: 2
    severity: LOW

  # --- Reserved range: numbers >= 900 are for events the Sentinel SDK
  # itself emits. Auto-allocation never counts them, so adding one here
  # can't collide with a number an agent already handed out on its own.

  SENTINEL_GAP:       # SDK was cut off from the agent; sent on reconnect
    category: SYSTEM
    code: SYS
    number: 901
    severity: INFO    # the SDK raises it to MEDIUM when events were lost
